name: Publish v0.1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.1.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish v0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publisher commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_SHA}^")"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

          git show "$release_commit:pyproject.toml" | grep -F 'version = "0.1.1"'
          git show "$release_commit:src/inspector/__init__.py" | grep -F '__version__ = "0.1.1"'
          git show "$release_commit:uv.lock" | grep -A3 -F 'name = "visual-inspection-reporter"' | grep -F 'version = "0.1.1"'

      - name: Refuse to overwrite existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v0.1.1 >/dev/null; then
            echo 'v0.1.1 tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.1 release already exists; refusing to overwrite.' >&2
            exit 1
          fi

      - name: Create annotated v0.1.1 tag at release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.1 "${{ steps.release.outputs.commit }}" -m "visual-inspection-reporter v0.1.1 — Security & Evidence Closure"
          git push origin refs/tags/v0.1.1

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Overview

          `v0.1.1` closes the post-v0.1.0 documentation, governance, dependency-security, and packaging work without changing detector, provider, or pipeline behavior.

          ## What changed since v0.1.0

          - restored/calibrated README claims to the actual evidence boundary
          - added a faithful English README
          - documented the protected-branch contribution workflow
          - patched vulnerable transitive dependencies in the locked environment
          - aligned package metadata and `inspector.__version__` to 0.1.1
          - added release-metadata consistency coverage
          - added wheel/sdist build and clean wheel-install smoke to CI

          ## Evidence boundary remains unchanged

          - Gemini and OpenAI synchronous providers have verified successful live E2E runs
          - Claude remains Experimental; no successful live response is claimed
          - Gemini Batch remains Experimental; no successful live job is claimed
          - synthetic PCB fixtures validate pipeline/report rendering, not detector accuracy
          - no dataset imagery is shipped; HRIPCB remains license-unknown and VisDrone remains subject to upstream academic-use terms

          ## Scope intentionally excluded

          No new providers, paid API reruns, detector/model changes, benchmark refresh, cost-table refresh, or stronger production-readiness claims were added for this release.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "visual-inspection-reporter v0.1.1 — Security & Evidence Closure" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
