name: Refresh release lock

on:
  push:
    branches: [release/v0.1.1]
    paths:
      - ".github/workflows/refresh-release-lock.yml"
      - "pyproject.toml"
      - "src/inspector/__init__.py"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh uv.lock from release metadata
        run: uv lock
      - name: Verify locked install
        run: uv sync --locked --group dev
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock for v0.1.1"
          git push origin HEAD:release/v0.1.1
