[project]
name = "visual-inspection-reporter"
version = "0.1.1"
description = "Evidence-grounded PCB/UAV inspection reporting: local YOLO26 ONNX detection + commercial VLM APIs with finding-id traceability."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10",
    "google-genai>=1.0",
    "openai>=1.60",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "gradio>=5.0",
    "anthropic>=0.116.0",
    "markdown>=3.10.2",
    "huggingface-hub>=0.24",  # README 的權重下載指令依賴 `hf` CLI；本來是 gradio 的間接依賴，明確列出避免未來版本升級悄悄斷掉
]

[project.urls]
Homepage = "https://github.com/kuotunyu/visual-inspection-reporter"
Repository = "https://github.com/kuotunyu/visual-inspection-reporter"
Release = "https://github.com/kuotunyu/visual-inspection-reporter/releases/tag/v0.1.1"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
